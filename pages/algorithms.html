<h3 id="about"> About this class </h3>

<p>
This class is an introduction to the design, analysis, and applications of algorithms for fundamental problems where the input are naturally interepreted as geometric objects.  Specific problems we may consider include <a href="https://medium.com/@harshitsikchi/convex-hulls-explained-baab662c4e94">convex hulls</a>, <a href="https://www.youtube.com/watch?v=b_uvofsYl9s">Voronoi diagrams</a>, <a href="https://www.youtube.com/watch?v=58cO-fBMEWk">line segment intersection</a>, <a href="https://www.youtube.com/watch?v=2x4ioToqe_c">polygon triangulation</a>, <a href="https://en.wikipedia.org/wiki/Range_searching">geometric range searching</a>, <a href="https://en.wikipedia.org/wiki/LP-type_problem">low-dimensional linear programming</a>, <a href="https://en.wikipedia.org/wiki/Euclidean_shortest_path">geometric shortest paths</a>, and <a href="https://en.wikipedia.org/wiki/Visibility_graph">visibility</a>.   Computational geometry has immediate applications in many other research areas, including computer graphics, mesh generation, geographic information systems, VLSI design, and robotics.  While we may briefly consider these applications, the class will primarily focus on theoretical results and techniques.

<p>
In short, this is an algorithms class, with lots of pretty pictures!  Lectures, homeworks, and exams will assume a solid background in algorithms, at least at the level of CS 374.

<p>
